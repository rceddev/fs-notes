<style>
  .example-container {
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100%;
  }
  .container{
    display: flex;
    flex-direction: column; /* Arrange items vertically */
    height: 100%;
  }
  .section-header{margin-top: 2px;
    flex: 0;
  }
  .section-content{margin-top: 2px;
    flex: auto;
  }
  body, html {
        height: 100%;
        margin: 0;
    }

</style>



<main class="container">
  <div class="section-header">
    <app-header (toggleOptionsEvent)="toogleSideNav()"></app-header>
  </div>
  <div class="section-content">
    <mat-sidenav-container class="example-container">
      <mat-sidenav mode="push"  [opened]=sideNaveOpened>
        <app-options/>
      </mat-sidenav>
      <mat-sidenav-content>
        <router-outlet />    
      </mat-sidenav-content>
    </mat-sidenav-container> 
  </div>
</main>
