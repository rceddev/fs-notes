@if (active) {
  <div class="card-container">
      <mat-card 
        class="example-card" 
        [style.background-color]="noteColor">
          <mat-card-header>
            <mat-card-title>{{title}}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>{{ content }}</p>
            <mat-divider></mat-divider>
          </mat-card-content>
          <mat-card-actions>
              <button 
                mat-icon-button  
                color="warn" 
                aria-label="Delete"
                (click)="onDeleteOpenDialog()">
                  <mat-icon>delete</mat-icon>
              </button>
              <button mat-icon-button
                color="warn" 
                aria-label="Edit"
                (click)="onUpdateOpenDialog()">
                  <mat-icon>edit_note</mat-icon>
              </button>
          </mat-card-actions>
          <mat-card-footer [hidden]="isHidden">
            <mat-progress-bar  mode="indeterminate"></mat-progress-bar>
          </mat-card-footer>
        </mat-card>  
  </div>
}
